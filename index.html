<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pivný účet</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d2a25">
<meta name="apple-mobile-web-app-title" content="Pivný účet">

<style>
:root{--bg:#eef1ec;--card:#fff;--ink:#1d2a25;--mute:#5d6d66;--line:#d3dad4;--gold:#9a6200;--goldbg:#f6e2b3;--red:#a8321f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18221e;--card:#223029;--ink:#eef2ec;--mute:#9baba3;--line:#34463d;--gold:#f0b73a;--goldbg:#4a3a14;--red:#ff8d77}}
:root[data-theme="dark"]{--bg:#18221e;--card:#223029;--ink:#eef2ec;--mute:#9baba3;--line:#34463d;--gold:#f0b73a;--goldbg:#4a3a14;--red:#ff8d77}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
h1{font:700 26px/1.1 Georgia,"Times New Roman",serif;margin:0}
header{padding:18px 16px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sum{font-size:14px;color:var(--mute);text-align:right}
.sum b{display:block;font:700 22px Georgia,serif;color:var(--gold)}
main{padding:0 12px;max-width:560px;margin:0 auto}
.add{display:flex;gap:8px;margin:8px 0 14px}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px}
button{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.pri{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:700}
.p{background:var(--card);border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-radius:0;background:none;padding:14px;text-align:left}
.nm{font-weight:700;font-size:18px}
.tot{font:700 22px Georgia,serif}
.tot.z{color:var(--mute)}
.pb{padding:0 14px 14px;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.grid button{text-align:left;padding:10px}
.grid small{display:block;color:var(--mute)}
.grid .l{background:var(--goldbg)}
.log{font-size:14px;color:var(--mute);margin:6px 0}
.log span{display:inline-block;margin:2px 6px 2px 0;padding:2px 8px;border-radius:99px;background:var(--bg)}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1}
.danger{color:var(--red)}
.pr{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.pr input.n{flex:2}.pr input.c{flex:1;text-align:right}
.hd{font:700 18px Georgia,serif;margin:16px 2px 8px}
.empty{color:var(--mute);padding:18px 4px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:16px;font-weight:600;color:var(--mute)}
nav button.on{color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
</style>
</head>
<body>
<header><h1>Pivný účet</h1><div class="sum">Spolu na účte<b id="all">0,00 €</b></div></header>
<main id="app"></main>
<nav><button id="t1" class="on">Ľudia</button><button id="t2">Cenník</button></nav>
<script>
(function(){
var KEY="pivny-ucet-v1";
var def={people:[],items:[
{id:"i1",name:"Pivo 0,5 l",price:2,type:"b"},
{id:"i2",name:"Pivo 0,3 l",price:1.5,type:"b"},
{id:"i3",name:"Vodka 4 cl",price:2,type:"l"},
{id:"i4",name:"Rum 4 cl",price:2.5,type:"l"},
{id:"i5",name:"Borovička 4 cl",price:2,type:"l"},
{id:"i6",name:"Fernet 4 cl",price:2.5,type:"l"}]};
var S=load(),tab=1,open=null,armed=null;
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&d.people&&d.items)return d}}catch(e){}return JSON.parse(JSON.stringify(def))}
var cloud=null,tm=null;
function save(){var j=JSON.stringify(S);try{localStorage.setItem(KEY,j)}catch(e){}
 if(cloud){clearTimeout(tm);tm=setTimeout(function(){try{cloud.set({json:j,t:Date.now()}).catch(function(){})}catch(e){}},400)}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function eur(n){return n.toFixed(2).replace(".",",")+" €"}
function total(p){return p.orders.reduce(function(a,o){return a+o.price},0)}
function uid(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function find(id){return S.people.filter(function(p){return p.id===id})[0]}
function render(){
 var all=S.people.reduce(function(a,p){return a+total(p)},0);
 document.getElementById("all").textContent=eur(all);
 document.getElementById("t1").className=tab===1?"on":"";
 document.getElementById("t2").className=tab===2?"on":"";
 var h="";
 if(tab===1){
  h+='<div class="add"><input id="np" placeholder="Meno nového človeka" maxlength="40" autocomplete="off"><button class="pri" data-a="addp">Pridať</button></div>';
  if(!S.people.length)h+='<div class="empty">Zatiaľ nikto. Pridaj prvé meno a potom mu ťukaj nápoje.</div>';
  S.people.forEach(function(p){
   var t=total(p),o=open===p.id;
   h+='<div class="p"><button class="ph" data-a="tog" data-id="'+p.id+'" aria-expanded="'+o+'"><span class="nm">'+esc(p.name)+'</span><span class="tot'+(t?'':' z')+'">'+eur(t)+'</span></button>';
   if(o){
    h+='<div class="pb"><div class="grid">';
    S.items.forEach(function(i){h+='<button data-a="buy" data-id="'+p.id+'" data-i="'+i.id+'" class="'+(i.type==="l"?"l":"")+'">'+esc(i.name)+'<small>'+eur(i.price)+'</small></button>'});
    h+='</div>';
    var cnt={};p.orders.forEach(function(x){cnt[x.name]=(cnt[x.name]||0)+1});
    var k=Object.keys(cnt);
    if(k.length){h+='<div class="log">';k.forEach(function(n){h+='<span>'+cnt[n]+'× '+esc(n)+'</span>'});h+='</div>'}
    h+='<div class="row"><button data-a="undo" data-id="'+p.id+'"'+(p.orders.length?'':' disabled')+'>Zrušiť posledné</button>';
    h+='<button data-a="paid" data-id="'+p.id+'"'+(p.orders.length?'':' disabled')+'>'+(armed==="paid"+p.id?"Naozaj vynulovať?":"Zaplatil")+'</button>';
    h+='<button class="danger" data-a="delp" data-id="'+p.id+'">'+(armed==="del"+p.id?"Naozaj?":"Zmazať")+'</button></div></div>';
   }
   h+='</div>';
  });
  if(S.people.length){
   h+='<div class="hd">Odpočítať rovným dielom</div><div class="add"><input id="sp" inputmode="decimal" placeholder="Suma v €" aria-label="Suma na odpočet"><button class="pri" data-a="split">Odpočítať</button></div><div class="log">Suma sa rozdelí medzi '+S.people.length+' ľudí a odpočíta každému.</div>';
  }
 }else{
  h+='<div class="hd">Cenník</div>';
  S.items.forEach(function(i){
   h+='<div class="pr"><input class="n" data-f="name" data-i="'+i.id+'" value="'+esc(i.name)+'" aria-label="Názov"><input class="c" inputmode="decimal" data-f="price" data-i="'+i.id+'" value="'+String(i.price).replace(".",",")+'" aria-label="Cena v eurách"><button class="danger" data-a="deli" data-i="'+i.id+'" aria-label="Zmazať položku">✕</button></div>';
  });
  h+='<div class="row"><button data-a="addi" data-t="b">+ Pivo</button><button data-a="addi" data-t="l">+ Tvrdé</button></div>';
 }
 var keep=document.activeElement&&document.activeElement.id==="np";
 document.getElementById("app").innerHTML=h;
 if(keep){var n=document.getElementById("np");if(n)n.focus()}
}
document.getElementById("t1").onclick=function(){tab=1;armed=null;render()};
document.getElementById("t2").onclick=function(){tab=2;armed=null;render()};
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-a]");if(!b)return;
 var a=b.dataset.a,id=b.dataset.id,p=id?find(id):null;
 if(a==="addp"){var inp=document.getElementById("np"),v=inp.value.trim();if(!v)return;var q={id:uid(),name:v,orders:[]};S.people.push(q);open=q.id;armed=null}
 else if(a==="split"){var sv=parseFloat(document.getElementById("sp").value.replace(",","."));if(isNaN(sv)||sv<=0||!S.people.length)return;var sh=Math.round(sv/S.people.length*100)/100;S.people.forEach(function(x){x.orders.push({name:"Odpočet "+eur(sh),price:-sh,t:Date.now()})});armed=null}
 else if(a==="tog"){open=open===id?null:id;armed=null}
 else if(a==="buy"){var it=S.items.filter(function(x){return x.id===b.dataset.i})[0];if(p&&it)p.orders.push({name:it.name,price:it.price,t:Date.now()});armed=null}
 else if(a==="undo"){if(p)p.orders.pop();armed=null}
 else if(a==="paid"){if(armed==="paid"+id){p.orders=[];armed=null}else armed="paid"+id}
 else if(a==="delp"){if(armed==="del"+id){S.people=S.people.filter(function(x){return x.id!==id});open=null;armed=null}else armed="del"+id}
 else if(a==="addi"){S.items.push({id:uid(),name:b.dataset.t==="l"?"Nové tvrdé 4 cl":"Nové pivo",price:2,type:b.dataset.t})}
 else if(a==="deli"){S.items=S.items.filter(function(x){return x.id!==b.dataset.i})}
 save();render();
});
document.addEventListener("change",function(e){
 var f=e.target.dataset.f;if(!f)return;
 var it=S.items.filter(function(x){return x.id===e.target.dataset.i})[0];if(!it)return;
 if(f==="name"){it.name=e.target.value.trim()||it.name}
 else{var v=parseFloat(e.target.value.replace(",","."));if(!isNaN(v)&&v>=0)it.price=v}
 save();render();
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&(e.target.id==="np"||e.target.id==="sp")){var b=document.querySelector(e.target.id==="np"?'[data-a="addp"]':'[data-a="split"]');if(b)b.click()}});
render();
(async function(){
 try{
  if(!window.claude||!window.claude.use)return;
  var db=await window.claude.use("db"),u=await window.claude.use("user");
  if(!db||!u)return;
  var id=await u.id();if(!id)return;
  var ref=db.doc("data/users/"+id+"/state");
  var snap=await ref.get();
  if(snap.exists){
   var d=snap.data();
   if(d&&d.json){var c=JSON.parse(d.json);if(c&&c.people&&c.items){S=c;try{localStorage.setItem(KEY,d.json)}catch(e){}render()}}
  }else{await ref.set({json:JSON.stringify(S),t:Date.now()})}
  cloud=ref;
 }catch(e){}
})();
})();
</script>
</body>
</html>
