<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TourDeBeer</title>
<link rel="icon" href="icon-192-v2.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180-v2.png">
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="theme-color" content="#06110d">
<meta name="apple-mobile-web-app-title" content="TourDeBeer">
<style>
:root{--bg:#06110d;--card:rgba(255,255,255,.045);--line:rgba(125,255,205,.13);--ink:#eef6f1;--mute:#86a095;--acc:#4fd1a1;--accbg:rgba(79,209,161,.15);--gold:#e9b44c;--red:#ff8d77;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:radial-gradient(120% 55% at 50% 0,#10301f 0,#06110d 62%) no-repeat;padding-bottom:140px}
main{max-width:560px;margin:0 auto;padding:0 14px}
h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:0;line-height:1.1}
h2{font-size:17px;margin:20px 4px 10px;font-weight:700}
.head{padding:22px 4px 14px}
.who{display:flex;align-items:center;gap:14px;padding:22px 4px 16px}
.who img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--acc);padding:2px;background:#e9e2db}
.chip{display:inline-flex;align-items:center;gap:7px;margin-top:7px;font-size:13px;color:var(--mute)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mute)}
.chip.on::before{background:var(--acc);box-shadow:0 0 8px var(--acc)}.chip.off::before{background:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.ct{font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between}.ct span{color:var(--acc)}
.total{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,rgba(79,209,161,.2),rgba(79,209,161,.04))}
.total b{font-size:30px;font-weight:800;color:var(--acc)}
button,input{font:inherit;color:var(--ink)}
button{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
button:disabled{opacity:.4}
input{flex:1;min-width:0;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:12px}
input::placeholder{color:var(--mute)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.pri{background:var(--acc);border-color:var(--acc);color:#04140e;font-weight:700}
.danger{color:var(--red)}.sm{padding:6px 10px;font-size:13px}
.add{display:flex;gap:8px;margin:0 0 12px}.pr{display:flex;gap:8px;align-items:center;margin-bottom:8px}.pr .n{flex:2}.pr .c{flex:1;text-align:right}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}
.log{font-size:14px;color:var(--mute);margin:6px 2px}.log span{display:inline-block;margin:2px 6px 2px 0;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.06)}
.empty{color:var(--mute);text-align:center}
.seg{display:flex;padding:4px;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:10px 4px;font-weight:600;border-radius:10px}.seg button.on{background:var(--accbg);color:var(--acc)}
.p{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-radius:0;background:none;padding:15px 14px;text-align:left}
.nm{font-weight:700;font-size:18px}.tot{font-size:21px;font-weight:800}.tot.z{color:var(--mute)}
.pb{padding:0 14px 14px;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.grid button{text-align:left;padding:10px 12px}
.grid small{display:block;color:var(--mute)}.grid .l{border-color:rgba(233,180,76,.45);background:rgba(233,180,76,.09)}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px 4px}
.rt{display:flex;flex-wrap:wrap;align-items:center;padding:4px 14px 0}.p .rt:last-child{padding-bottom:6px}
.rl{flex:1;font-weight:600}.rv{font-size:13px;color:var(--mute)}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;margin:6px 0 8px}
.nums button{padding:9px 0;font-size:16px;text-align:center;min-width:0}.nums button.on{background:var(--acc);border-color:var(--acc);color:#04140e;font-weight:800}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 2px;border-top:1px solid var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;background:rgba(8,22,17,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-radius:0;background:none;color:var(--mute);font-size:12px;font-weight:600;padding:6px 0}
nav .t.on{color:var(--acc)}
nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav .mid{flex:0 0 68px;width:68px;height:68px;margin:-32px 8px 2px;border-radius:50%;padding:0;border:2px solid rgba(79,209,161,.55);background:radial-gradient(circle at 35% 25%,#37a77f,#145a43);box-shadow:0 6px 22px rgba(30,160,115,.4);display:flex;align-items:center;justify-content:center;color:#eafff6}
nav .mid.on{box-shadow:0 0 0 4px rgba(79,209,161,.25),0 6px 22px rgba(30,160,115,.55)}
nav .mid svg{width:34px;height:34px}
</style>
</head>
<body>
<main id="app"></main>
<nav>
<button class="t" data-a="nav" data-t="acc"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Účet</button>
<button class="mid" data-a="nav" data-t="prof" aria-label="Profil"><svg viewBox="0 0 24 24"><path d="M6.5 9h8.5v10.5a1 1 0 0 1-1 1H7.5a1 1 0 0 1-1-1z"/><path d="M15 11h2.2a1.8 1.8 0 0 1 1.8 1.8v2.4a1.8 1.8 0 0 1-1.8 1.8H15"/><path d="M6 9a2.2 2.2 0 0 1 1.2-4A3.2 3.2 0 0 1 12 3.8 3 3 0 0 1 15.8 5.4 2.1 2.1 0 0 1 15 9"/><path d="M9.3 12.5v4.5M12.2 12.5v4.5"/></svg></button>
<button class="t" data-a="nav" data-t="tdb"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>TourDeBeer</button>
</nav>
<script>
(function(){
var LS={g:function(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},s:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var DB_URL="https://pivny-ucet-default-rtdb.europe-west1.firebasedatabase.app";
var q=new URLSearchParams(location.search);
var db=(q.get("db")||DB_URL||LS.g("db")).replace(/\/+$/,"");
var room=clean(q.get("r")||LS.g("room"));
if(q.get("db")&&q.get("r")){LS.s("db",db);LS.s("room",room)}
var DEF={i1:{name:"Pivo 0,5 l",price:2,type:"b"},i2:{name:"Pivo 0,3 l",price:1.5,type:"b"},i3:{name:"Vodka 4 cl",price:2,type:"l"},i4:{name:"Rum 4 cl",price:2.5,type:"l"},i5:{name:"Borovička 4 cl",price:2,type:"l"},i6:{name:"Fernet 4 cl",price:2.5,type:"l"}};
var DEV=LS.g("dev")||(function(){var v="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);LS.s("dev",v);return v})();
function emptyD(){return{items:{},people:{},orders:{},pubs:{},beers:{},ratings:{}}}
var D=emptyD(),last="",online=false,tab="acc",tsub="pubs",psub="tdb",open=null,armed=null,seeded=false,msg="";
var app=document.getElementById("app");
function clean(v){return String(v||"").toLowerCase().replace(/[^a-z0-9_-]/g,"")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function eur(n){return n.toFixed(2).replace(".",",")+" €"}
function uid(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function byT(o){return Object.keys(o||{}).sort(function(a,b){return (o[a].t||0)-(o[b].t||0)})}
function total(pid){var o=D.orders[pid]||{};return Object.keys(o).reduce(function(a,k){return a+o[k].price},0)}
function api(method,path,body){return fetch(db+"/rooms/"+room+path+".json",{method:method,body:body===undefined?undefined:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error("http");return r.json()})}
function status(){var e=document.getElementById("st");if(!e)return;e.className="chip "+(online?"on":"off");e.textContent="Miestnosť "+room+(online?": pripojené":": bez spojenia")}
function loc(obj){Object.keys(obj).forEach(function(p){var a=p.split("/"),o=D;for(var i=0;i<a.length-1;i++){o=o[a[i]]=o[a[i]]||{}}var l=a[a.length-1];if(obj[p]===null)delete o[l];else o[l]=obj[p]})}
function W(obj){loc(obj);last="";render();return api("PATCH","",obj).then(poll).catch(function(){online=false;status()})}
function busy(){var a=document.activeElement;return a&&a.tagName==="INPUT"}
function poll(){
 if(!db||!room)return Promise.resolve();
 return api("GET","").then(function(d){
  online=true;d=d||{};
  var n={items:d.items||{},people:d.people||{},orders:d.orders||{},pubs:d.pubs||{},beers:d.beers||{},ratings:d.ratings||{}},j=JSON.stringify(n);
  if(!Object.keys(n.items).length&&!seeded){seeded=true;W({items:DEF});return}
  if(j!==last){last=j;D=n;if(!busy())render()}
  status();
 }).catch(function(){online=false;status()});
}
function rinfo(k,id){var r=(D.ratings[k]||{})[id]||{},v=Object.keys(r).map(function(x){return r[x]}).filter(function(x){return x>=1&&x<=5});return{n:v.length,a:v.length?v.reduce(function(a,b){return a+b},0)/v.length:0,own:(r[DEV]>=1&&r[DEV]<=5)?r[DEV]:-1}}
function rateRow(k,id,label){var s=rinfo(k,id),h='<div class="rt"><span class="rl">'+label+'</span><span class="rv">'+(s.n?'Ø '+s.a.toFixed(1).replace(".",",")+' ('+s.n+')':'zatiaľ nič')+'</span><div class="nums">';for(var i=1;i<=5;i++)h+='<button data-a="rate" data-k="'+k+'" data-id="'+id+'" data-v="'+i+'" class="'+(i===s.own?'on':'')+'" aria-label="Známka '+i+' z 5">'+i+'</button>';return h+'</div></div>'}
function seg(key,opts,cur){return '<div class="seg">'+opts.map(function(o){return '<button data-a="seg" data-k="'+key+'" data-v="'+o[0]+'" class="'+(o[0]===cur?'on':'')+'">'+o[1]+'</button>'}).join("")+'</div>'}
function accView(){
 var ids=byT(D.people),all=ids.reduce(function(a,id){return a+total(id)},0);
 var h='<div class="head"><h1>Účet</h1><div class="chip" id="st"></div></div><div class="card total"><span>Spolu na účte</span><b>'+eur(all)+'</b></div>';
 h+='<div class="add"><input id="np" data-enter placeholder="Meno nového človeka" maxlength="40" autocomplete="off"><button class="pri" data-a="addp">Pridať</button></div>';
 if(!ids.length)h+='<div class="empty card">Zatiaľ nikto. Pridaj prvé meno a potom mu ťukaj nápoje.</div>';
 ids.forEach(function(id){
  var p=D.people[id],t=total(id),o=open===id,ord=D.orders[id]||{},ok=byT(ord);
  h+='<div class="p"><button class="ph" data-a="tog" data-id="'+id+'" aria-expanded="'+o+'"><span class="nm">'+esc(p.name)+'</span><span class="tot'+(t?'':' z')+'">'+eur(t)+'</span></button>';
  if(o){
   h+='<div class="pb"><div class="grid">';
   byT(D.items).concat(Object.keys(D.items)).filter(function(v,i,a){return a.indexOf(v)===i}).forEach(function(i){var it=D.items[i];h+='<button data-a="buy" data-id="'+id+'" data-i="'+i+'" class="'+(it.type==="l"?"l":"")+'">'+esc(it.name)+'<small>'+eur(it.price)+'</small></button>'});
   h+='</div>';
   var cnt={};ok.forEach(function(k){var n=ord[k].name;cnt[n]=(cnt[n]||0)+1});
   var kk=Object.keys(cnt);
   if(kk.length){h+='<div class="log">';kk.forEach(function(n){h+='<span>'+cnt[n]+'× '+esc(n)+'</span>'});h+='</div>'}
   h+='<div class="row"><button data-a="undo" data-id="'+id+'"'+(ok.length?'':' disabled')+'>Zrušiť posledné</button>';
   h+='<button data-a="paid" data-id="'+id+'"'+(ok.length?'':' disabled')+'>'+(armed==="paid"+id?"Naozaj vynulovať?":"Zaplatil")+'</button>';
   h+='<button class="danger" data-a="delp" data-id="'+id+'">'+(armed==="del"+id?"Naozaj?":"Zmazať")+'</button></div></div>';
  }
  h+='</div>';
 });
 if(ids.length)h+='<h2>Odpočítať rovným dielom</h2><div class="add"><input id="sp" data-enter inputmode="decimal" placeholder="Suma v €" aria-label="Suma na odpočet"><button class="pri" data-a="split">Odpočítať</button></div><div class="log">Suma sa rozdelí medzi '+ids.length+' ľudí a odpočíta každému.</div>';
 return h;
}
function tdbView(){
 var pub=tsub==="pubs",coll=pub?"pubs":"beers",kinds=pub?[["krcma","Krčma"],["obsluha","Obsluha"]]:[["pivo","Pivo"]],ids=byT(D[coll]);
 var h='<div class="head"><h1>TourDeBeer</h1><div class="chip" id="st"></div></div>'+seg("tsub",[["pubs","Krčmy"],["beers","Piva"]],tsub)+'<div class="log">Známky ako v škole: 1 je najlepšie, 5 najhoršie.</div>';
 if(!ids.length)h+='<div class="card empty">'+(pub?"Zatiaľ žiadna krčma.":"Zatiaľ žiadne pivo.")+' Pridaj ich v profile.<div class="row"><button data-a="nav" data-t="prof" data-p="tdb">Otvoriť profil</button></div></div>';
 ids.forEach(function(id){h+='<div class="p"><div class="gh"><span class="nm">'+esc(D[coll][id].name)+'</span></div>';kinds.forEach(function(k){h+=rateRow(k[0],id,k[1])});h+='</div>'});
 return h;
}
function listCard(coll,title,ph,inp){
 var ids=byT(D[coll]),h='<div class="card"><div class="ct">'+title+'<span>'+ids.length+'</span></div><div class="add"><input id="'+inp+'" data-enter placeholder="'+ph+'" maxlength="40" autocomplete="off"><button class="pri" data-a="addg" data-g="'+coll+'" data-in="'+inp+'">Pridať</button></div>';
 ids.forEach(function(id){h+='<div class="li"><span>'+esc(D[coll][id].name)+'</span><button class="danger sm" data-a="delg" data-g="'+coll+'" data-id="'+id+'">'+(armed==="dg"+id?"Naozaj?":"Zmazať")+'</button></div>'});
 if(!ids.length)h+='<div class="log">Zatiaľ prázdne.</div>';
 return h+'</div>';
}
function profView(){
 var h='<div class="who"><img src="icon-192-v2.png" alt=""><div><h1>Môj profil</h1><div class="chip" id="st"></div></div></div>'+seg("psub",[["tdb","TourDeBeer"],["set","Nastavenia"]],psub);
 if(psub==="tdb")return h+listCard("pubs","Krčmy, ktoré chcem hodnotiť","Názov krčmy","ngp")+listCard("beers","Piva (databáza)","Názov piva","ngb");
 h+='<div class="card"><div class="ct">Alkohol a ceny</div>';
 Object.keys(D.items).forEach(function(i){var it=D.items[i];
  h+='<div class="pr"><input class="n" data-f="name" data-i="'+i+'" value="'+esc(it.name)+'" aria-label="Názov"><input class="c" inputmode="decimal" data-f="price" data-i="'+i+'" value="'+String(it.price).replace(".",",")+'" aria-label="Cena v eurách"><button class="danger" data-a="deli" data-i="'+i+'" aria-label="Zmazať položku">✕</button></div>'});
 h+='<div class="row"><button data-a="addi" data-t="b">+ Pivo</button><button data-a="addi" data-t="l">+ Tvrdé</button></div></div>';
 h+='<div class="card"><div class="ct">Spoločná miestnosť</div><div class="log">Kód miestnosti: <b>'+esc(room)+'</b></div><div class="row"><button data-a="share">'+(msg==="copied"?"Odkaz skopírovaný":"Zdieľať odkaz")+'</button><button data-a="leave">Zmeniť miestnosť</button></div></div>';
 return h;
}
function setupView(){
 var h='<div class="head"><h1>TourDeBeer</h1></div><div class="card"><div class="ct">Pripojenie k spoločnému účtu</div><div class="log">Zadaj kód miestnosti. Všetci s rovnakým kódom uvidia ten istý účet.</div>';
 if(!db)h+='<div class="pr"><input id="dbi" placeholder="Adresa databázy https://…" autocapitalize="off" autocomplete="off"></div>';
 h+='<div class="add"><input id="roi" data-enter placeholder="Kód miestnosti, napr. piatok" value="'+esc(room)+'" autocapitalize="off" autocomplete="off"><button class="pri" data-a="conn">Pripojiť</button></div>';
 if(msg)h+='<div class="log danger">'+esc(msg)+'</div>';
 return h+'</div>';
}
function render(){
 var ready=db&&room;
 document.querySelector("nav").style.display=ready?"flex":"none";
 Array.prototype.forEach.call(document.querySelectorAll("nav [data-t]"),function(n){n.classList.toggle("on",n.dataset.t===tab)});
 app.innerHTML=!ready?setupView():tab==="acc"?accView():tab==="tdb"?tdbView():profView();
 status();
}
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-a]");if(!b)return;
 var a=b.dataset.a,id=b.dataset.id,now=Date.now(),o={};
 if(a==="nav"){tab=b.dataset.t;if(b.dataset.p)psub=b.dataset.p;armed=null;render();window.scrollTo(0,0);return}
 if(a==="seg"){if(b.dataset.k==="tsub")tsub=b.dataset.v;else psub=b.dataset.v;armed=null;render();return}
 if(a==="conn"){var di=document.getElementById("dbi"),u=di?di.value.trim().replace(/\/+$/,""):db,r=clean(document.getElementById("roi").value);
  if(u.indexOf("https://")!==0||!r){msg="Zadaj kód miestnosti (a adresu databázy, ak chýba).";render();return}
  db=u;room=r;msg="";LS.s("db",db);LS.s("room",room);D=emptyD();last="";seeded=false;render();poll();return}
 if(a==="leave"){LS.s("room","");room="";D=emptyD();render();return}
 if(a==="share"){var link=location.origin+location.pathname+"?db="+encodeURIComponent(db)+"&r="+room;
  if(navigator.share){navigator.share({title:"TourDeBeer",url:link}).catch(function(){})}
  else{try{navigator.clipboard.writeText(link);msg="copied";render();setTimeout(function(){msg="";render()},2000)}catch(x){}}return}
 if(a==="addp"){var v=document.getElementById("np").value.trim();if(!v)return;var nid=uid();o["people/"+nid]={name:v,t:now};open=nid;armed=null}
 else if(a==="tog"){open=open===id?null:id;armed=null;render();return}
 else if(a==="buy"){var it=D.items[b.dataset.i];if(!it)return;o["orders/"+id+"/"+uid()]={name:it.name,price:it.price,t:now};armed=null}
 else if(a==="undo"){var ks=byT(D.orders[id]||{});if(!ks.length)return;o["orders/"+id+"/"+ks[ks.length-1]]=null;armed=null}
 else if(a==="paid"){if(armed==="paid"+id){o["orders/"+id]=null;armed=null}else{armed="paid"+id;render();return}}
 else if(a==="delp"){if(armed==="del"+id){o["people/"+id]=null;o["orders/"+id]=null;open=null;armed=null}else{armed="del"+id;render();return}}
 else if(a==="split"){var sv=parseFloat(document.getElementById("sp").value.replace(",","."));var pk=Object.keys(D.people);if(isNaN(sv)||sv<=0||!pk.length)return;var sh=Math.round(sv/pk.length*100)/100;pk.forEach(function(k){o["orders/"+k+"/"+uid()]={name:"Odpočet "+eur(sh),price:-sh,t:now}});armed=null}
 else if(a==="addg"){var gv=document.getElementById(b.dataset.in).value.trim();if(!gv)return;o[b.dataset.g+"/"+uid()]={name:gv,t:now}}
 else if(a==="delg"){if(armed==="dg"+id){var gc=b.dataset.g;o[gc+"/"+id]=null;(gc==="pubs"?["krcma","obsluha"]:["pivo"]).forEach(function(k){o["ratings/"+k+"/"+id]=null});armed=null}else{armed="dg"+id;render();return}}
 else if(a==="rate"){var rk=b.dataset.k,rv=parseInt(b.dataset.v,10);o["ratings/"+rk+"/"+id+"/"+DEV]=rinfo(rk,id).own===rv?null:rv}
 else if(a==="addi"){o["items/"+uid()]={name:b.dataset.t==="l"?"Nové tvrdé 4 cl":"Nové pivo",price:2,type:b.dataset.t,t:now}}
 else if(a==="deli"){o["items/"+b.dataset.i]=null}
 else return;
 W(o);
});
document.addEventListener("change",function(e){
