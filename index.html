<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="theme-color" content="#06110d">
<meta name="apple-mobile-web-app-title" content="TourDeBeer">
<style>
:root{--bg:#06110d;--card:rgba(255,255,255,.045);--line:rgba(125,255,205,.13);--ink:#eef6f1;--mute:#86a095;--acc:#4fd1a1;--accbg:rgba(79,209,161,.15);--gold:#e9b44c;--red:#ff8d77;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:radial-gradient(120% 55% at 50% 0,#10301f 0,#06110d 62%) no-repeat;padding-bottom:140px}
main{max-width:560px;margin:0 auto;padding:0 14px}
h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:0;line-height:1.1}
h2{font-size:17px;margin:20px 4px 10px;font-weight:700}
.head{padding:26px 4px 14px}
.who{display:flex;align-items:center;gap:14px;padding:22px 4px 16px}
.who img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--acc);padding:2px;background:#e9e2db}
.chip{display:inline-flex;align-items:center;gap:7px;margin-top:7px;font-size:13px;color:var(--mute)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mute)}
.chip.on::before{background:var(--acc);box-shadow:0 0 8px var(--acc)}.chip.off::before{background:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.ct{font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between}.ct span{color:var(--acc)}
.total{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,rgba(79,209,161,.2),rgba(79,209,161,.04))}
.total b{font-size:30px;font-weight:800;color:var(--acc)}
button,input{font:inherit;color:var(--ink)}
button{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
button:disabled{opacity:.4}
input{flex:1;min-width:0;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:12px}
input::placeholder{color:var(--mute)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

function logoBox(){return '<div class="logo"><img src="'+LOGO+'" alt="TourDeBeer"></div>'}
function vals(r){return Object.keys(r||{}).filter(function(m){return D.mem[m]&&r[m]>=1&&r[m]<=5}).map(function(m){return r[m]})}
function avgs(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}
function f1(n){return n.toFixed(1).replace(".",",")}
function who(){return as&&D.mem[as]?as:DEV}
function edsSorted(){return Object.keys(D.ed).sort(function(a,b){return (parseInt(D.ed[b].year)||0)-(parseInt(D.ed[a].year)||0)||(D.ed[b].t||0)-(D.ed[a].t||0)})}
function curE(){if(!D.ed[eid]){var k=edsSorted();eid=k.length?k[0]:""}return eid}
function pubsSorted(ids){return ids.sort(function(a,b){var x=D.pubs[a],y=D.pubs[b];return ((x.area||"")+"|"+x.name).localeCompare((y.area||"")+"|"+y.name,"sk")})}
var KIND=[["krcma","Krčma"],["pivo","Pivo"],["obsluha","Obsluha"]];
function starRow(e,pid,k,label){
 var r=((D.rt[e]||{})[pid]||{})[k]||{},v=vals(r),w=who(),own=D.mem[w]&&r[w]>=1&&r[w]<=5?r[w]:0;
 var h='<div class="rt"><span class="rl">'+label+'</span><span class="rv">'+(v.length?'Ø '+f1(avgs(v))+' ('+v.length+')':'zatiaľ nič')+'</span><div class="stars">';
 for(var i=1;i<=5;i++)h+='<button data-a="rate" data-e="'+e+'" data-id="'+pid+'" data-k="'+k+'" data-v="'+i+'" class="'+(i<=own?'on':'')+'" aria-label="'+i+' z 5">★</button>';
 return h+'</div></div>';
}
function pubRate(e,pid){
 var P=D.pubs[pid]||{name:"(zmazaná krčma)"},sp=D.ed[e].pubs[pid],R=(D.rt[e]||{})[pid]||{},w=who();
 var beers=byT(P.beers||{}).map(function(b){return P.beers[b].name}),cur=sp.beer||"";
 if(cur&&beers.indexOf(cur)<0)beers.push(cur);
 var h='<div class="p"><div class="gh"><span class="nm">'+esc(P.name)+(P.area?'<small class="ar">'+esc(P.area)+'</small>':'')+'</span><button class="danger sm" data-a="unpick" data-e="'+e+'" data-id="'+pid+'">'+(armed==="up"+pid?"Naozaj?":"Odobrať")+'</button></div>';
 h+='<div class="rt"><span class="rl">Hodnotené pivo</span><select data-sel="beer" data-e="'+e+'" data-id="'+pid+'"><option value="">vyber pivo</option>'+beers.map(function(n){return '<option'+(n===cur?' selected':'')+'>'+esc(n)+'</option>'}).join("")+'</select></div>';
 KIND.forEach(function(k){h+=starRow(e,pid,k[0],k[1])});
 var oth=Object.keys(D.mem).filter(function(m){return m!==w&&KIND.some(function(k){return (R[k[0]]||{})[m]})});
 h+='<div class="rt"><button class="sm" data-a="oth" data-id="'+pid+'">Ostatní ('+oth.length+')</button></div>';
 if(openO[pid]&&oth.length){h+='<div class="oth"><div class="log">Krčma · Pivo · Obsluha</div>';oth.forEach(function(m){h+='<div class="li"><span>'+esc(D.mem[m].name)+'</span><b>'+KIND.map(function(k){return (R[k[0]]||{})[m]||"–"}).join(" · ")+'</b></div>'});h+='</div>'}
 return h+'</div>';
}
function nameCard(){return '<div class="card"><div class="ct">Tvoje meno</div><div class="add"><input id="mn" data-enter placeholder="Napr. Roman" maxlength="30"><button class="pri" data-a="savename">Uložiť</button></div><div class="log'+(msg==="name"?' danger':'')+'">Meno uvidia ostatní pri hodnoteniach. Najprv ho vyplň.</div></div>'}
function statView(){
 var all=edsSorted(),sel=stsc!=="all"&&D.ed[stsc]?[stsc]:all;
 var h='<div class="chips"><button data-a="sc" data-id="all" class="'+(sel===all?"on":"")+'">Celkovo</button>'+all.map(function(id){return '<button data-a="sc" data-id="'+id+'" class="'+(sel.length===1&&sel[0]===id&&sel!==all?"on":"")+'">'+esc(D.ed[id].year)+'</button>'}).join("")+'</div>';
 if(!all.length)return h+'<div class="card empty">Zatiaľ žiadne ročníky.</div>';
 var P={},B={},M={};
 sel.forEach(function(e){var E=D.ed[e],R=D.rt[e]||{};
  var mwp=missWin(E);if(mwp)M[mwp]=(M[mwp]||0)+1;
  Object.keys(R).forEach(function(pid){var pb=D.pubs[pid];if(!pb)return;var bn=(((E.pubs||{})[pid]||{}).beer||"").trim();
   KIND.forEach(function(k){var v=vals((R[pid]||{})[k[0]]);if(!v.length)return;
    var p=P[pid]=P[pid]||{name:pb.name,k:{}},c=p.k[k[0]]=p.k[k[0]]||[];v.forEach(function(x){c.push(x)});
    if(k[0]==="pivo"&&bn){var bk=norm(bn)+"|"+pid,b=B[bk]=B[bk]||{name:bn,pub:pb.name,v:[]};v.forEach(function(x){b.v.push(x)})}})})});
 function box(t,arr,fmt){var s='<h2>'+t+'</h2><div class="card">';if(!arr.length)return s+'<div class="log">Zatiaľ bez hodnotení.</div></div>';arr.slice(0,10).forEach(function(x,i){s+='<div class="li"><span>'+(i+1)+'. '+esc(x.name)+'<small class="ar">'+fmt(x)+'</small></span><b>'+f1(x.a)+' ★</b></div>'});return s+'</div>'}
 var pl=Object.keys(P).map(function(id){var p=P[id];return{name:p.name,p:p,a:avgs(Object.keys(p.k).map(function(k){return avgs(p.k[k])}))}}).sort(function(a,b){return b.a-a.a});
 var bl=Object.keys(B).map(function(k){return{name:B[k].name,pub:B[k].pub,a:avgs(B[k].v),n:B[k].v.length}}).sort(function(a,b){return b.a-a.a});
 var ol=Object.keys(P).filter(function(id){return P[id].k.obsluha}).map(function(id){var v=P[id].k.obsluha;return{name:P[id].name,a:avgs(v),n:v.length}}).sort(function(a,b){return b.a-a.a});
 h+=box("Poradie krčiem",pl,function(x){return KIND.map(function(k){return k[1]+" "+(x.p.k[k[0]]?f1(avgs(x.p.k[k[0]])):"–")}).join(" · ")});
 h+=box("Poradie pív",bl,function(x){return esc(x.pub)+" · "+x.n+" hodnotení"});
 h+=box("Najlepšia obsluha",ol,function(x){return x.n+" hodnotení"});
 var mk=Object.keys(M).sort(function(a,b){return M[b]-M[a]});
 h+='<h2>Miss krčmy (víťazstvá)</h2><div class="card">'+(mk.length?mk.slice(0,10).map(function(id,i){return '<div class="li"><span>'+(i+1)+'. '+esc(D.pubs[id].name)+'</span><b>'+M[id]+'×</b></div>'}).join(""):'<div class="log">Zatiaľ žiadne hlasy.</div>')+'</div>';
 return h;
}
function tdbView(){
 var h='<div class="head"><h1>TourDeBeer</h1><div class="chip" id="st"></div></div>'+seg("tsub",[["rate","Hodnotenie"],["stat","Štatistika"]],tsub);
 if(tsub==="stat")return h+statView();
 var all=edsSorted(),e=curE();
 h+='<div class="chips">'+all.map(function(id){return '<button data-a="ed" data-id="'+id+'" class="'+(id===e?"on":"")+'">'+esc(D.ed[id].year)+'</button>'}).join("")+'<button data-a="newed">+ Ročník</button></div>';
 if(newEd)h+='<div class="card"><div class="ct">Nový ročník</div><div class="pr"><input id="ney" inputmode="numeric" placeholder="Rok" value="'+new Date().getFullYear()+'"><input id="nen" inputmode="numeric" placeholder="Počet krčiem" value="12"></div><div class="row"><button class="pri" data-a="mked">Vytvoriť</button><button data-a="newed">Zrušiť</button></div></div>';
 if(!e)return h+'<div class="card empty">Zatiaľ žiadny ročník. Vytvor ho tlačidlom + Ročník. Minulé ročníky môžeš doplniť spätne.</div>';
 var E=D.ed[e],w=who(),picked=byT(E.pubs||{}),n=E.n||12;
 if(E.date)h+='<div class="log">Dátum: '+esc(E.date)+'</div>';
 if(!D.mem[DEV])h+=nameCard();
 var ms=Object.keys(D.mem).sort(function(a,b){return D.mem[a].name.localeCompare(D.mem[b].name,"sk")});
 if(ms.length)h+='<div class="card"><div class="pr"><span class="rl">Hodnotí</span><select data-sel="as">'+(D.mem[w]?'':'<option value="" selected>vyber</option>')+ms.map(function(m){return '<option value="'+m+'"'+(m===w?" selected":"")+'>'+esc(D.mem[m].name)+(m===DEV?" (ja)":"")+'</option>'}).join("")+'</select></div></div>';
 var free=pubsSorted(Object.keys(D.pubs).filter(function(id){return !(E.pubs||{})[id]}));
 h+='<div class="card"><div class="ct">Vybrané krčmy<span>'+picked.length+'/'+n+'</span></div><div class="add"><select id="psel"><option value="">vyber krčmu zo zoznamu</option>'+free.map(function(id){var P=D.pubs[id];return '<option value="'+id+'">'+esc(P.name)+(P.area?' ('+esc(P.area)+')':'')+'</option>'}).join("")+'</select><button class="pri" data-a="pick" data-e="'+e+'"'+(picked.length>=n?' disabled':'')+'>Pridať</button></div>';
 h+='<div class="pr"><span class="rl">Počet krčiem v ročníku</span><input class="c" style="max-width:90px" inputmode="numeric" data-f="en" data-e="'+e+'" value="'+n+'"></div></div>';
 if(!picked.length)h+='<div class="card empty">Vyber krčmy, ktoré sa budú hodnotiť. Zoznam krčiem spravuješ v Nastaveniach.</div>';
 picked.forEach(function(pid){h+=pubRate(e,pid)});
 if(picked.length){
  var votes={},myv=(E.miss||{})[w]||"";
  Object.keys(E.miss||{}).forEach(function(m){var pid=E.miss[m];if(D.mem[m]&&(E.pubs||{})[pid])votes[pid]=(votes[pid]||0)+1});
  var vk=Object.keys(votes).sort(function(a,b){return votes[b]-votes[a]});
  h+='<h2>Miss krčmy</h2><div class="card"><div class="add"><select data-sel="miss" data-e="'+e+'"><option value="">môj tip na Miss krčmy</option>'+picked.map(function(pid){return '<option value="'+pid+'"'+(pid===myv?" selected":"")+'>'+esc((D.pubs[pid]||{}).name||"?")+'</option>'}).join("")+'</select></div>'+(missWin(E)?'<div class="log">Víťaz: <b>'+esc((D.pubs[missWin(E)]||{}).name||"?")+'</b></div>':'')+(vk.length?'<div class="log">'+vk.map(function(pid){return '<span>'+esc((D.pubs[pid]||{}).name||"?")+' '+votes[pid]+'</span>'}).join("")+'</div>':'<div class="log">Zatiaľ žiadne hlasy.</div>')+'</div>';
 }
 return h+'<div class="row"><button class="danger" data-a="deled" data-e="'+e+'">'+(armed==="ed"+e?"Naozaj zmazať ročník?":"Zmazať ročník")+'</button></div>';
}
function profView(){
 var me=D.mem[DEV],ms=Object.keys(D.mem).sort(function(a,b){return (D.mem[a].t||0)-(D.mem[b].t||0)});
 var h='<div class="card"><div class="ct">Môj profil</div><div class="add"><input id="mn" data-enter placeholder="Tvoje meno" maxlength="30" value="'+esc(me?me.name:"")+'"><button class="pri" data-a="savename">Uložiť</button></div><div class="log">Meno uvidia ostatní pri hodnoteniach.</div></div>';
 h+='<div class="card"><div class="ct">Účastníci<span>'+ms.length+'</span></div>';
 ms.forEach(function(m){h+='<div class="li" style="flex-wrap:wrap"><input data-f="mname" data-m="'+m+'" value="'+esc(D.mem[m].name)+'" aria-label="Meno" style="flex:1 1 100%">'+(m===DEV?'<span class="log" style="margin:0">Toto som ja</span>':'<button class="sm" data-a="claim" data-id="'+m+'">To som ja</button><button class="danger sm" data-a="delmem" data-id="'+m+'">'+(armed==="dm"+m?"Naozaj?":"Zmazať")+'</button>')+'</div>'});
 return h+'<div class="add" style="margin-top:10px"><input id="mn2" data-enter placeholder="Pridať účastníka bez apky" maxlength="30"><button class="pri" data-a="addmem">Pridať</button></div></div>';
}
function pubsView(){
 var ids=pubsSorted(Object.keys(D.pubs)),h='<div class="card"><div class="ct">Pridať krčmu</div><div class="pr"><input id="pn" placeholder="Názov krčmy" maxlength="40"><input id="pa" placeholder="Oblasť" maxlength="30"></div><div class="row"><button class="pri" data-a="addpub">Pridať krčmu</button></div></div>';
 h+='<div class="card"><div class="ct">Zoznam krčiem<span>'+ids.length+'</span></div>';
 ids.forEach(function(id){var P=D.pubs[id],bs=byT(P.beers||{}),o=openP===id;
  h+='<div class="li pk"><button class="lnk" data-a="pubtog" data-id="'+id+'" aria-expanded="'+o+'"><b>'+esc(P.name)+'</b><small class="ar">'+esc(P.area||"bez oblasti")+' · piv: '+bs.length+'</small></button></div>';
  if(o){h+='<div class="oth"><div class="pr"><input data-f="pname" data-id="'+id+'" value="'+esc(P.name)+'" aria-label="Názov krčmy"><input data-f="parea" data-id="'+id+'" value="'+esc(P.area||"")+'" placeholder="Oblasť" aria-label="Oblasť"></div>';bs.forEach(function(b){h+='<div class="li"><span>'+esc(P.beers[b].name)+'</span><button class="danger sm" data-a="delbeer" data-id="'+id+'" data-b="'+b+'" aria-label="Zmazať pivo">✕</button></div>'});
   h+='<div class="add" style="margin-top:8px"><input id="bn" data-enter placeholder="Pridať čapované pivo" maxlength="40"><button class="pri" data-a="addbeer" data-id="'+id+'">Pridať</button></div><div class="row"><button class="danger" data-a="delpub" data-id="'+id+'">'+(armed==="pb"+id?"Naozaj zmazať krčmu?":"Zmazať krčmu")+'</button></div></div>'}});
 return h+'<div class="row"><button data-a="reseed">Doplniť zoznam z Excelu</button></div></div>';
}
function priceView(){
 var h='<div class="card"><div class="ct">Alkohol a ceny</div>';
 Object.keys(D.items).forEach(function(i){var it=D.items[i];
  h+='<div class="pr"><input class="n" data-f="name" data-i="'+i+'" value="'+esc(it.name)+'" aria-label="Názov"><input class="c" inputmode="decimal" data-f="price" data-i="'+i+'" value="'+String(it.price).replace(".",",")+'" aria-label="Cena v eurách"><button class="danger" data-a="deli" data-i="'+i+'" aria-label="Zmazať položku">✕</button></div>'});
 return h+'<div class="row"><button data-a="addi" data-t="b">+ Pivo</button><button data-a="addi" data-t="l">+ Tvrdé</button></div></div>';
}
function settingsView(){
 if(!(db&&room))return logoBox()+'<div class="head"><h1>Nastavenia</h1></div>'+setupView().replace('<div class="head"><h1>Účet</h1><div class="chip">Nepripojené</div></div>','');
 var h=logoBox()+'<div class="head"><h1>Nastavenia</h1><div class="chip" id="st"></div></div>'+seg("ssub",[["prof","Profil"],["pubs","Krčmy"],["price","Ceny"],["room","Miestnosť"]],ssub);
 return h+(ssub==="prof"?profView():ssub==="pubs"?pubsView():ssub==="price"?priceView():roomCard());
}
function noRoomView(t){return '<div class="head"><h1>'+t+'</h1></div><div class="card empty">Najprv sa pripoj do miestnosti. Kód zadáš v záložke Účet alebo v Nastaveniach.<div class="row"><button class="pri" data-a="nav" data-t="acc">Prejsť na Účet</button></div></div>'}
function roomCard(){return '<div class="card"><div class="log">Kód miestnosti: <b>'+esc(room)+'</b></div><div class="row"><button data-a="share">'+(msg==="copied"?"Odkaz skopírovaný":"Zdieľať odkaz")+'</button><button data-a="leave">Zmeniť miestnosť</button></div><div class="row"><button data-a="backup">Stiahnuť zálohu dát</button></div></div>'}
function setupView(){
 var h='<div class="head"><h1>Účet</h1><div class="chip">Nepripojené</div></div><div class="card"><div class="ct">Pripojenie k spoločnému účtu</div><div class="log">Zadaj kód miestnosti. Všetci s rovnakým kódom uvidia ten istý účet.</div>';
 if(!db)h+='<div class="pr"><input id="dbi" placeholder="Adresa databázy https://…" autocapitalize="off" autocomplete="off"></div>';
 h+='<div class="add"><input id="roi" data-enter placeholder="Kód miestnosti, napr. piatok" value="'+esc(room)+'" autocapitalize="off" autocomplete="off"><button class="pri" data-a="conn">Pripojiť</button></div>';
 if(msg)h+='<div class="log danger">'+esc(msg)+'</div>';
 return h+'</div>';
}
function syncUrl(){try{var q2="?r="+room+(db!==DB_URL?"&db="+encodeURIComponent(db):"");if(location.search!==q2)history.replaceState(null,"",location.pathname+q2)}catch(e){}}
function render(){
 var ready=db&&room;if(ready)syncUrl();
 Array.prototype.forEach.call(document.querySelectorAll("nav [data-t]"),function(n){n.classList.toggle("on",n.dataset.t===tab)});
 app.innerHTML=tab==="acc"?accView():tab==="set"?settingsView():!ready?noRoomView("TourDeBeer"):tdbView();
 status();
}
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-a]");if(!b)return;
 var a=b.dataset.a,id=b.dataset.id,now=Date.now(),o={};
 if(a==="nav"){tab=b.dataset.t;armed=null;render();window.scrollTo(0,0);return}
 if(a==="seg"){if(b.dataset.k==="tsub")tsub=b.dataset.v;else ssub=b.dataset.v;armed=null;render();return}
 if(a==="conn"){var di=document.getElementById("dbi"),u=di?di.value.trim().replace(/\/+$/,""):db,r=clean(document.getElementById("roi").value);
  if(u.indexOf("https://")!==0||!r){msg="Zadaj kód miestnosti (a adresu databázy, ak chýba).";render();return}
  db=u;room=r;msg="";LS.s("db",db);LS.s("room",room);D=emptyD();last="";seeded=false;render();poll();return}
 if(a==="leave"){LS.s("room","");room="";try{history.replaceState(null,"",location.pathname)}catch(x){}D=emptyD();render();return}
 if(a==="share"){var link=location.origin+location.pathname+"?db="+encodeURIComponent(db)+"&r="+room;
  if(navigator.share){navigator.share({title:"TourDeBeer",url:link}).catch(function(){})}
  else{try{navigator.clipboard.writeText(link);msg="copied";render();setTimeout(function(){msg="";render()},2000)}catch(x){}}return}
 if(a==="addp"){var v=document.getElementById("np").value.trim();if(!v)return;var nid=uid();o["people/"+nid]={name:v,t:now};open=nid;armed=null}
 else if(a==="tog"){open=open===id?null:id;armed=null;render();return}
 else if(a==="buy"){var it=D.items[b.dataset.i];if(!it)return;o["orders/"+id+"/"+uid()]={name:it.name,price:it.price,t:now};armed=null}
 else if(a==="undo"){var ks=byT(D.orders[id]||{});if(!ks.length)return;o["orders/"+id+"/"+ks[ks.length-1]]=null;armed=null}
 else if(a==="paid"){if(armed==="paid"+id){o["orders/"+id]=null;armed=null}else{armed="paid"+id;render();return}}
 else if(a==="delp"){if(armed==="del"+id){o["people/"+id]=null;o["orders/"+id]=null;open=null;armed=null}else{armed="del"+id;render();return}}
 else if(a==="split"){var sv=parseFloat(document.getElementById("sp").value.replace(",","."));var pk=Object.keys(D.people);if(isNaN(sv)||sv<=0||!pk.length)return;var sh=Math.round(sv/pk.length*100)/100;pk.forEach(function(k){o["orders/"+k+"/"+uid()]={name:"Odpočet "+eur(sh),price:-sh,t:now}});armed=null}
 else if(a==="addi"){o["items/"+uid()]={name:b.dataset.t==="l"?"Nové tvrdé 4 cl":"Nové pivo",price:2,type:b.dataset.t,t:now}}
 else if(a==="deli"){o["items/"+b.dataset.i]=null}
 else if(a==="backup"){try{var bl=new Blob([JSON.stringify({room:room,date:new Date().toISOString(),data:D},null,1)],{type:"application/json"}),an=document.createElement("a");an.href=URL.createObjectURL(bl);an.download="tourdebeer-zaloha-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(an);an.click();an.remove()}catch(x){}return}
 else if(a==="oth"){openO[id]=!openO[id];render();return}
 else if(a==="ed"){eid=id;armed=null;render();return}
 else if(a==="sc"){stsc=id;render();return}
 else if(a==="newed"){newEd=!newEd;render();return}
 else if(a==="mked"){var yr=document.getElementById("ney").value.trim(),cn=parseInt(document.getElementById("nen").value,10);if(!yr)return;var neid=uid();o["ed/"+neid]={year:yr,n:(cn>=1&&cn<=40)?cn:12,t:now};eid=neid;newEd=false}
 else if(a==="deled"){var de=b.dataset.e;if(armed==="ed"+de){o["ed/"+de]=null;o["rt/"+de]=null;eid="";armed=null}else{armed="ed"+de;render();return}}
 else if(a==="pick"){var pv=document.getElementById("psel").value;if(!pv)return;var pbs=D.pubs[pv]&&D.pubs[pv].beers?Object.keys(D.pubs[pv].beers):[];o["ed/"+b.dataset.e+"/pubs/"+pv]={t:now,beer:pbs.length===1?D.pubs[pv].beers[pbs[0]].name:""}}
 else if(a==="unpick"){var ue=b.dataset.e;if(armed==="up"+id){o["ed/"+ue+"/pubs/"+id]=null;o["rt/"+ue+"/"+id]=null;armed=null}else{armed="up"+id;render();return}}
 else if(a==="rate"){var w=who();if(!D.mem[w]){msg="name";render();return}var rv=parseInt(b.dataset.v,10),rr=((D.rt[b.dataset.e]||{})[id]||{})[b.dataset.k]||{};o["rt/"+b.dataset.e+"/"+id+"/"+b.dataset.k+"/"+w]=rr[w]===rv?null:rv}
 else if(a==="claim"){DEV=id;LS.s("dev",id);as="";armed=null;render();return}
 else if(a==="savename"){var nm=document.getElementById("mn").value.trim();if(!nm)return;var ex=!D.mem[DEV]&&Object.keys(D.mem).filter(function(k){return norm(D.mem[k].name)===norm(nm)})[0];if(ex){DEV=ex;LS.s("dev",ex);as="";msg="";render();return}o["mem/"+DEV+"/name"]=nm;if(!D.mem[DEV])o["mem/"+DEV+"/t"]=now;msg=""}
 else if(a==="addmem"){var m2=document.getElementById("mn2").value.trim();if(!m2)return;o["mem/"+uid()]={name:m2,t:now}}
 else if(a==="delmem"){if(armed==="dm"+id){o["mem/"+id]=null;armed=null}else{armed="dm"+id;render();return}}
 else if(a==="addpub"){var pn=document.getElementById("pn").value.trim();if(!pn)return;var np2=uid();o["pubs/"+np2]={name:pn,area:document.getElementById("pa").value.trim(),t:now};openP=np2}
 else if(a==="pubtog"){openP=openP===id?null:id;armed=null;render();return}
 else if(a==="addbeer"){var bv=document.getElementById("bn").value.trim();if(!bv)return;o["pubs/"+id+"/beers/"+uid()]={name:bv,t:now}}
 else if(a==="delbeer"){o["pubs/"+id+"/beers/"+b.dataset.b]=null}
 else if(a==="delpub"){if(armed==="pb"+id){o["pubs/"+id]=null;openP=null;armed=null}else{armed="pb"+id;render();return}}
 else if(a==="reseed"){o=seedObj(D.pubs)}
 else return;
 W(o);
});
document.addEventListener("change",function(e){
 var t=e.target,sl=t.dataset.sel,o2={};
 if(sl){
  if(sl==="as"){as=t.value;render();return}
  if(sl==="beer")o2["ed/"+t.dataset.e+"/pubs/"+t.dataset.id+"/beer"]=t.value||null;
  else if(sl==="miss"){if(!D.mem[who()]){msg="name";render();return}o2["ed/"+t.dataset.e+"/miss/"+who()]=t.value||null}
  W(o2);return}
 if(t.dataset.f==="en"){var cn=parseInt(t.value,10);if(cn>=1&&cn<=40){o2["ed/"+t.dataset.e+"/n"]=cn;W(o2)}else render();return}
 if(t.dataset.f==="pname"||t.dataset.f==="parea"){var pv2=t.value.trim();if(t.dataset.f==="pname"&&!pv2){render();return}o2["pubs/"+t.dataset.id+"/"+(t.dataset.f==="pname"?"name":"area")]=pv2;W(o2);return}
 if(t.dataset.f==="mname"){var mv=t.value.trim();if(mv){o2["mem/"+t.dataset.m+"/name"]=mv;W(o2)}else render();return}
 var f=e.target.dataset.f,i=e.target.dataset.i;if(!f||!D.items[i])return;var o={};
 if(f==="name"){var n=e.target.value.trim();if(!n)return;o["items/"+i+"/name"]=n}
 else{var v=parseFloat(e.target.value.replace(",","."));if(isNaN(v)||v<0)return;o["items/"+i+"/price"]=v}
 W(o);
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.hasAttribute&&e.target.hasAttribute("data-enter")){var r=e.target.closest(".add")||e.target.closest(".card"),b=r&&r.querySelector("button.pri");if(b)b.click()}});
render();poll();setInterval(poll,3000);
})();
</script>
