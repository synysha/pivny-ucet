<style>
:root{--bg:#06110d;--card:rgba(255,255,255,.045);--line:rgba(125,255,205,.13);--ink:#eef6f1;--mute:#86a095;--acc:#4fd1a1;--accbg:rgba(79,209,161,.15);--gold:#e9b44c;--red:#ff8d77;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;background:radial-gradient(120% 55% at 50% 0,#10301f 0,#06110d 62%) no-repeat;padding-bottom:140px}
main{max-width:560px;margin:0 auto;padding:0 14px}
h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:0;line-height:1.1}
h2{font-size:17px;margin:20px 4px 10px;font-weight:700}
.head{padding:26px 4px 14px}
.who{display:flex;align-items:center;gap:14px;padding:22px 4px 16px}
.who img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--acc);padding:2px;background:#e9e2db}
.chip{display:inline-flex;align-items:center;gap:7px;margin-top:7px;font-size:13px;color:var(--mute)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mute)}
.chip.on::before{background:var(--acc);box-shadow:0 0 8px var(--acc)}.chip.off::before{background:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.ct{font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between}.ct span{color:var(--acc)}
.total{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,rgba(79,209,161,.2),rgba(79,209,161,.04))}
.total b{font-size:30px;font-weight:800;color:var(--acc)}
button,input{font:inherit;color:var(--ink)}
button{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
button:disabled{opacity:.4}
input{flex:1;min-width:0;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:12px}
input::placeholder{color:var(--mute)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.pri{background:var(--acc);border-color:var(--acc);color:#04140e;font-weight:700}
.danger{color:var(--red)}.sm{padding:6px 10px;font-size:13px}
.add{display:flex;gap:8px;margin:0 0 12px}.pr{display:flex;gap:8px;align-items:center;margin-bottom:8px}.pr .n{flex:2}.pr .c{flex:1;text-align:right}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}
.log{font-size:14px;color:var(--mute);margin:6px 2px}.log span{display:inline-block;margin:2px 6px 2px 0;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.06)}
.empty{color:var(--mute);text-align:center}.card .log{margin:0 0 10px}
.seg{display:flex;padding:4px;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:10px 4px;font-weight:600;border-radius:10px}.seg button.on{background:var(--accbg);color:var(--acc)}
.p{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-radius:0;background:none;padding:15px 14px;text-align:left}
.nm{font-weight:700;font-size:18px}.tot{font-size:21px;font-weight:800}.tot.z{color:var(--mute)}
.pb{padding:0 14px 14px;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.grid button{text-align:left;padding:10px 12px;display:flex;align-items:center;gap:10px}.ib{display:flex;flex:0 0 26px;width:26px;height:26px;color:var(--acc)}.ib svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.it{min-width:0}
.grid small{display:block;color:var(--mute)}.grid button{border-color:rgba(255,255,255,.65)}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px 4px}
.rt{display:flex;flex-wrap:wrap;align-items:center;padding:4px 14px 0}.p .rt:last-child{padding-bottom:6px}
.rl{flex:1;font-weight:600}.rv{font-size:13px;color:var(--mute)}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;margin:6px 0 8px}
.nums button{padding:9px 0;font-size:16px;text-align:center;min-width:0}.nums button.on{background:var(--acc);border-color:var(--acc);color:#04140e;font-weight:800}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 2px;border-top:1px solid var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:flex-end;background:rgba(8,22,17,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-radius:0;background:none;color:var(--mute);font-size:12px;font-weight:600;padding:6px 0}
nav .t.on{color:var(--acc)}
nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav .mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-radius:0;background:none;color:var(--mute);font-size:12px;font-weight:600;padding:0;margin-top:-32px}
nav .mid.on{color:var(--acc)}
nav .orb{width:68px;height:68px;border-radius:50%;border:2px solid rgba(79,209,161,.55);background:radial-gradient(circle at 35% 25%,#37a77f,#145a43);box-shadow:0 6px 22px rgba(30,160,115,.4);display:flex;align-items:center;justify-content:center;color:#eafff6}
nav .mid.on .orb{box-shadow:0 0 0 4px rgba(79,209,161,.25),0 6px 22px rgba(30,160,115,.55)}
nav .orb svg{width:34px;height:34px}
.logo{margin:30px 0 0;border-radius:18px;overflow:hidden;background:#e9e2db}.logo img{display:block;width:100%;height:auto}.logo+.head{padding-top:14px}
.hl{display:flex;justify-content:space-between;align-items:center;gap:8px}.mascot{width:92px;height:auto;flex:0 0 auto}.tag{margin-top:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.stars button:disabled{opacity:1;cursor:default}.stars button.on:disabled{color:var(--gold)}select:disabled{opacity:.7}
.dim{color:var(--mute)!important}.nm.dim{opacity:.85}.tapc{margin:0!important}.icb{padding:6px 8px;flex:0 0 auto}.icp{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px}.icp button{padding:6px 8px}.icp button.on{border-color:var(--acc);background:var(--accbg)}.pgr{display:flex;align-items:center;gap:8px;margin:6px 0 8px}.pgr span{flex:1;text-align:center;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pgr button{padding:6px 16px;font-size:20px;line-height:1}.pager{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;align-items:flex-start;margin-bottom:12px}.pager::-webkit-scrollbar{display:none}.pager>.p{flex:0 0 100%;scroll-snap-align:start;margin-bottom:0}.hl{align-items:flex-start}.hn{flex:1;min-width:0}.hn b{display:block}.tot2{font-weight:700;white-space:nowrap;padding-top:2px}.chipsp{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}.spc{display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-radius:99px;background:var(--accbg);border:1px solid var(--acc);color:var(--acc);font-weight:700;box-shadow:0 0 12px rgba(79,209,161,.3)}.spc small{font-weight:400;color:var(--mute)}.spc button{padding:2px 9px;border-radius:99px;border:0;background:rgba(0,0,0,.28);color:var(--ink)}.sumt{width:100%;border-collapse:collapse;font-size:14px}.sumt th{text-align:left;color:var(--mute);font-weight:600;font-size:12px;padding:2px 0 6px}.sumt td{padding:7px 0;border-top:1px solid var(--line)}.sumt th:nth-child(2),.sumt td:nth-child(2){text-align:center}.sumt th:last-child,.sumt td:last-child{text-align:right}.sumt tr.tt td{font-weight:700;color:var(--acc)}.mini{font-size:12px;color:var(--mute);margin:0 0 0 auto!important;gap:6px}.mini input{width:16px!important;height:16px!important}select.dim{color:var(--mute)}.li .chk input{margin:0}.chk{display:flex;align-items:center;gap:10px;margin:2px 0 10px;color:var(--ink)}.chk input{flex:0 0 auto;width:22px;height:22px;padding:0;accent-color:var(--acc)}
.rm{padding:0 14px}.rmh{display:flex;justify-content:space-between;align-items:baseline;font-weight:600;font-size:14px;margin:5px 0 4px}.rmh small{font-weight:400;font-size:12px;color:var(--mute)}
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.meter button{padding:5px 0;font-size:14px;font-weight:700;border:0;border-radius:9px;background:#244538;color:#fff}
.meter button:disabled{opacity:1;cursor:default}.meter .g1.on{background:#17a74a}.meter .g2.on{background:#74b62b}.meter .g3.on{background:#e3b422;color:#1b1400}.meter .g4.on{background:#e8832b}.meter .g5.on{background:#d9412f}
.rmc{text-align:center;font-weight:700;font-size:13px;margin:3px 0 6px;min-height:16px}.rmc.hint{font-weight:400;font-size:11px;color:var(--mute)}
.g1t{color:#2fd068}.g2t{color:#8fd33f}.g3t{color:#eec43a}.g4t{color:#f09a45}.g5t{color:#ee6a58}.li b span{font-weight:700}
.mapbox{height:58vh;min-height:320px;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-bottom:8px;background:#0b1a14}.mapbox.pm{height:300px;margin:8px 0}
.mapbox .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.55)}
.pin span{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#04140e;font-weight:800;font-size:11px;border:1.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.pin.off span{background:#6b7a73;color:#e8eee9}.pin.apx span{background:#0b1f18;color:var(--acc);border:2px dashed var(--acc)}.pin.sel span{width:26px;height:26px;background:#e3b422;color:#1b1400;font-size:13px}
select{flex:1;min-width:0;font:inherit;color:var(--ink);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:10px;max-width:100%}option{background:#0b1a14}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px}.chips button{flex:0 0 auto;white-space:nowrap}.chips button.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
.stars{display:flex;gap:2px;width:100%;margin:2px 0 8px}.stars button{flex:1;border:0;background:none;font-size:32px;line-height:1;color:rgba(255,255,255,.2);padding:6px 0}.stars button.on{color:var(--gold)}
.ar{display:block;font-size:13px;color:var(--mute);font-weight:400}.oth{padding:0 14px 10px}.card .oth{padding:0 0 4px}
.card>.li:first-of-type{border-top:0}.lnk{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;padding:4px 0;text-align:left}.pk{padding:4px 0}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb th{color:var(--mute);font-weight:600;font-size:12px;text-align:right;padding:6px 4px}.tb td{padding:9px 4px;border-top:1px solid var(--line);text-align:right;vertical-align:top}.tb th:first-child,.tb td:first-child{text-align:left}.tb td:first-child small{display:block;color:var(--mute);font-size:12px}.tb td b{color:var(--acc)}.seg button{font-size:15px}
</style>

function vals(r){return Object.keys(r||{}).filter(function(m){return D.mem[m]&&r[m]>=1&&r[m]<=5}).map(function(m){return r[m]})}
function avgs(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:0}
function f1(n){return n.toFixed(1).replace(".",",")}
function who(){return DEV}
function hpin(x){var h=5381;x=String(x)+"tdb";for(var i=0;i<x.length;i++)h=((h<<5)+h+x.charCodeAt(i))|0;return String(h)}
function isAdmin(){return !!D.meta.apin&&LS.g("adm")===D.meta.apin}
function nextNo(){var m=0;Object.keys(D.ed).forEach(function(k){m=Math.max(m,parseInt(D.ed[k].no)||0)});return m+1}
function fix4Obj(n){var o={"meta/fix4":true};HIST.forEach(function(H){var E=n.ed[H.id];if(E&&!E.no&&H.no)o["ed/"+H.id+"/no"]=H.no});Object.keys(n.ed).forEach(function(e){if(n.ed[e].lock==null)o["ed/"+e+"/lock"]=true});return o}
function adminCard(){var h='<div class="card"><div class="ct">Admin</div>';
 if(isAdmin())h+='<div class="log">Si prihlásený ako admin. Ročníky zamykáš a odomykáš v záložke TourDeBeer.</div><div class="row"><button data-a="adminoff">Odhlásiť admina</button></div>';
 else if(!D.meta.apin)h+='<div class="log">Nastav si admin PIN (aspoň 4 znaky). Kto ho nastaví ako prvý, je admin.</div><div class="add"><input id="apn" data-enter type="password" placeholder="Nový admin PIN" autocomplete="off"><button class="pri" data-a="setpin">Nastaviť</button></div>';
 else h+='<div class="log">Odomkni admin režim svojím PIN-om.</div><div class="add"><input id="apn" data-enter type="password" placeholder="Admin PIN" autocomplete="off"><button class="pri" data-a="admin">Odomknúť</button></div>';
 return h+(amsg?'<div class="log danger">'+esc(amsg)+'</div>':'')+'</div>'}
function edsSorted(){return Object.keys(D.ed).sort(function(a,b){return (parseInt(D.ed[b].year)||0)-(parseInt(D.ed[a].year)||0)||(D.ed[b].t||0)-(D.ed[a].t||0)})}
function curE(){if(!D.ed[eid]){var k=edsSorted();eid=k.length?k[0]:""}return eid}
function pubsSorted(ids){return ids.sort(function(a,b){var x=D.pubs[a],y=D.pubs[b];return ((x.area||"")+"|"+x.name).localeCompare((y.area||"")+"|"+y.name,"sk")})}
var KIND=[["pivo","Pivo"],["krcma","Krčma"],["obsluha","Obsluha"]];
function starRow(e,pid,k,label){
 var r=((D.rt[e]||{})[pid]||{})[k]||{},v=vals(r),w=who(),own=D.mem[w]&&r[w]>=1&&r[w]<=5?Math.round(r[w]):0,lk=!!D.ed[e].lock;
 var T={krcma:"Ako hodnotíš krčmu?",pivo:"Ako hodnotíš pivo?",obsluha:"Ako hodnotíš obsluhu?"}[k]||label;
 var h='<div class="rm"><div class="rmh"><span>'+T+'</span><small>'+(v.length?'Ø '+f1(avgs(v))+' ('+v.length+')':'zatiaľ nič')+'</small></div><div class="meter">';
 for(var i=1;i<=5;i++)h+='<button data-a="rate" data-e="'+e+'" data-id="'+pid+'" data-k="'+k+'" data-v="'+i+'" class="g'+i+(i===own?' on':'')+'" aria-label="Známka '+i+' z 5"'+(lk?' disabled':'')+'>'+i+'</button>';
 return h+'</div><div class="rmc'+(own?' g'+own+'t':' hint')+'">'+(own?GL[own]:(lk?'Ročník je uzavretý.':'Kliknutím vyberieš hodnotenie.'))+'</div></div>';
}
function pubRate(e,pid){
 var P=D.pubs[pid]||{name:"(zmazaná krčma)"},sp=D.ed[e].pubs[pid],R=(D.rt[e]||{})[pid]||{},w=who(),lk=!!D.ed[e].lock;
 var beers=byT(P.beers||{}).filter(function(b){return !P.beers[b].off}).map(function(b){return P.beers[b].name}),cur=sp.beer||"";
 if(cur&&beers.indexOf(cur)<0)beers.push(cur);
 var h='<div class="p"><div class="gh"><span class="nm'+(P.closed?' dim':'')+'">'+esc(P.name)+(P.area?'<small class="ar">'+esc(P.area)+'</small>':'')+'</span>'+(lk?'':'<button class="danger sm" data-a="unpick" data-e="'+e+'" data-id="'+pid+'">'+(armed==="up"+pid?"Naozaj?":"Odobrať")+'</button>')+'</div>';
 h+='<div class="rt"><span class="rl">Hodnotené pivo</span><select data-sel="beer" data-e="'+e+'" data-id="'+pid+'"'+(lk?' disabled':'')+(beerOff(pid,cur)?' class="dim"':'')+'><option value="">vyber pivo</option>'+beers.map(function(n){return '<option'+(n===cur?' selected':'')+'>'+esc(n)+'</option>'}).join("")+'</select></div>';
 KIND.forEach(function(k){h+=starRow(e,pid,k[0],k[1])});
 var oth=Object.keys(D.mem).filter(function(m){return m!==w&&KIND.some(function(k){return (R[k[0]]||{})[m]})});
 h+='<div class="rt"><button class="sm" data-a="oth" data-id="'+pid+'">Ostatní ('+oth.length+')</button></div>';
 if(openO[pid]&&oth.length){h+='<div class="oth"><div class="log">Pivo · Krčma · Obsluha</div>';oth.forEach(function(m){h+='<div class="li"><span>'+esc(D.mem[m].name)+'</span><b>'+KIND.map(function(k){var g=(R[k[0]]||{})[m];return g?'<span class="g'+Math.round(g)+'t">'+g+'</span>':'–'}).join(" · ")+'</b></div>'});h+='</div>'}
